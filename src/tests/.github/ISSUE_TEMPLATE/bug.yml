name: 🐛 Bogue
description: Signaler un dysfonctionnement (hors vulnérabilité de sécurité)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Pour une vulnérabilité de sécurité, utilisez le **signalement privé** (voir SECURITY.md)."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il, et qu'attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: "1. Aller sur…\n2. Cliquer sur…\n3. Constater…"
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement
      placeholder: "PHP 8.3, MariaDB 10.11, Apache 2.4, Firefox 131"
